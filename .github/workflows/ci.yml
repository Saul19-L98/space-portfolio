name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 6
      - run: npm run test:e2e
      - name: Static export build (GitHub Pages shape)
        run: npm run build
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_BASE_PATH: /space-portfolio
          NEXT_PUBLIC_SITE_URL: https://saul19-l98.github.io/space-portfolio
      - name: E2E against the export under the base path
        run: |
          node scripts/serve-static.mjs out 3100 /space-portfolio &
          sleep 2
          BASE_URL=http://127.0.0.1:3100/space-portfolio npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
